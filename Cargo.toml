[workspace]
resolver = "3"
members = ["crates/llimo", "crates/work-buddy"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
llimo = { path = "crates/llimo" }
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = "0.1"
